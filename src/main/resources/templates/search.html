<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>Результати пошуку</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
  </head>
  <body>
    <header class="header">
      <h1>Результати пошуку</h1>
      <nav>
        <a href="/" class="btn-1">Головна</a>
       
      </nav>
    </header>

   

      
      <div class="injection-section constructor-section">
        <div class="section-title" th:classappend="${#lists.isEmpty(books)} ? ' hidden' : ''">
          🔍 Результати через Constructor Injection
          <span class="section-badge constructor-badge">Singleton</span>
        </div>
       
        <div
          th:unless="${#lists.isEmpty(resultsConstructor)}"
          class="search-container"
        >
          <div th:each="book : ${resultsConstructor}" class="book-item">
            <img th:src="@{${book.imagePath}}" th:alt="${book.title}" />
            <p th:text="${book.title}"></p>
            <p th:text="${book.author}"></p>
            <p th:text="${book.keywords}"></p>
          </div>
        </div>
      </div>

     
      <div class="injection-section setter-section">
        <div class="section-title" th:classappend="${#lists.isEmpty(books)} ? ' hidden' : ''">
          🔍 Результати через Setter Injection
          <span class="section-badge setter-badge">Singleton</span>
        </div>
        
        <div
          th:unless="${#lists.isEmpty(resultsSetter)}"
          class="search-container"
        >
          <div th:each="book : ${resultsSetter}" class="book-item">
            <img th:src="@{${book.imagePath}}" th:alt="${book.title}" />
            <p th:text="${book.title}"></p>
            <p th:text="${book.author}"></p>
            <p th:text="${book.keywords}"></p>
          </div>
        </div>
      </div>


      <div class="injection-section field-section">
        <div class="section-title" th:classappend="${#lists.isEmpty(books)} ? ' hidden' : ''">
          🔍 Результати через Field Injection
          <span class="section-badge field-badge">Prototype</span>
        </div>
       
        <div
          th:unless="${#lists.isEmpty(resultsPrototype)}"
          class="search-container"
        >
          <div th:each="book : ${resultsPrototype}" class="book-item">
            <img th:src="@{${book.imagePath}}" th:alt="${book.title}" />
            <p th:text="${book.title}"></p>
            <p th:text="${book.author}"></p>
            <p th:text="${book.keywords}"></p>
          </div>
        </div>
      </div>

      
      <div
        th:if="${#lists.isEmpty(resultsConstructor) and #lists.isEmpty(resultsSetter) and #lists.isEmpty(resultsPrototype)}"
        class="no-results"
        style="text-align: center; margin-top: 40px"
      >
        <div class="no-results-text">
          <h2>Нічого не знайдено 😔</h2>
          <p>
            Спробуйте пошукати за іншими ключовими словами, автором або назвою
            книги.
          </p>
        </div>
        <img src="/img/hz4.png" alt="Зображення при відсутності результатів" />
      </div>
    </div>
  </body>
</html>
